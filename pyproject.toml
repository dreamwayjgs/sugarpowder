[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[project]
name = "sugarpowder"
version = "2.0.0"
authors = [{ name = "Geunseong Jung", email = "dreamwayjgs@gmail.com" }]
description = "A humble collection of Python utilities for data processing, serialization, and everyday patterns"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "blosc>=1.11.4",
    "dill>=0.4.1",
    "pandas>=2.3.3",
    "pyarrow>=23.0.1",
]
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/dreamwayjgs/sugarpowder"
"Bug Tracker" = "https://github.com/dreamwayjgs/sugarpowder/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
